{% extends "base.html" %}

{% block title %}OAuth Callback{% endblock %}

{% block content %}
  <h1>OAuth Callback</h1>
  {% if code %}
    <p>Authorization code:</p>
    <p><code>{{ code }}</code></p>
  {% else %}
    <p class="muted">No authorization code in the URL.</p>
  {% endif %}
{% endblock %}
