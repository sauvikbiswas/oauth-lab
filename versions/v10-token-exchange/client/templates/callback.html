{% extends "base.html" %}

{% block title %}OAuth Callback{% endblock %}

{% block content %}
  <h1>OAuth Callback</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% else %}
    <p>Authorization code:</p>
    <p><code>{{ code }}</code></p>
    <p>State:</p>
    <p><code>{{ state }}</code></p>
    <p>Access token:</p>
    <p><code>{{ access_token }}</code></p>
  {% endif %}
{% endblock %}
